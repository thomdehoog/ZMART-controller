# The controller's tests on Linux and Windows, on every push and pull request.
#
# They run on the mock driver, zmart_controller.mock, so no microscope is
# needed: the controller's and the mock driver's tests, and a style check.
name: tests

on:
  push:
    branches: [main, release-candidate]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the controller and the test tools
        run: python -m pip install -e ".[test]" ruff
      - name: The tests
        run: python -m pytest
      - name: Style
        run: |
          python -m ruff check .
          python -m ruff format --check .
